<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f3">
  <title>CupBack App</title>
  <link rel="icon" href="/mark.svg">
</head>
<body class="app">
  <header>
    <a href="./" class="brand" aria-label="CupBack home"><img src="/mark.svg" width="38" height="38" alt="">CupBack</a>
    <div class="actions"><span id="network"></span></div>
  </header>
  <main>
    <h1 class="app-title">Cup deposits</h1>
    <section class="workspace" aria-label="CupBack tools">
      <nav aria-label="Tasks">
        <button data-tab="deposit"><svg class="task-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10l-1.5 13h-7L7 7ZM6 7h12M9 4h6"/></svg><span>Pay deposit</span></button>
        <button data-tab="return"><svg class="task-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-2.5-1.5L12 20l-2.5-1.5L7 20V4Zm3 5h4m-4 4h4"/></svg><span>Find receipt</span></button>
        <button data-tab="setup"><svg class="task-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16v11H4zM3 9l2-5h14l2 5M9 20v-6h6v6"/></svg><span>Set up event</span></button>
      </nav>
      <div id="panel"></div>
      <p id="notice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer><a href="./">About CupBack</a></footer>
  <script type="module" src="/src.js"></script>
</body>
</html>
