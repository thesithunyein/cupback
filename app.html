<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f3">
  <title>CupBack App · Bitcoin Cash mainnet</title>
  <meta name="description" content="CupBack: pay and refund reusable-cup deposits on Bitcoin Cash mainnet. Connect a wallet with WizardConnect (Cashonize). Each deposit is held by a CashScript covenant that always refunds the guest in full.">
  <link rel="icon" href="/mark.svg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CupBack">
  <meta property="og:title" content="CupBack App: pay and refund cup deposits">
  <meta property="og:description" content="Pay a cup deposit at one booth. Get it back at any booth. 100% back, on Bitcoin Cash mainnet.">
  <meta property="og:url" content="https://cupback.vercel.app/app.html">
  <meta property="og:image" content="https://cupback.vercel.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="CupBack: Borrow a cup. Get your deposit back.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@thesithunyein">
  <meta name="twitter:title" content="CupBack App: pay and refund cup deposits">
  <meta name="twitter:description" content="Pay a cup deposit at one booth. Get it back at any booth. 100% back, on Bitcoin Cash mainnet.">
  <meta name="twitter:image" content="https://cupback.vercel.app/og.png">
</head>
<body class="app">
  <header>
    <a href="./" class="brand" aria-label="CupBack home"><img src="/mark.svg" width="38" height="38" alt="">CupBack</a>
    <div class="actions"><span id="network">Bitcoin Cash mainnet</span></div>
  </header>
  <main>
    <h1 class="sr-only">CupBack</h1>
    <section class="workspace" aria-label="CupBack tools">
      <nav aria-label="Tasks">
        <button data-tab="deposit"><svg class="task-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10l-1.5 13h-7L7 7ZM6 7h12M9 4h6"/></svg><span>Pay</span></button>
        <button data-tab="return"><svg class="task-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-2.5-1.5L12 20l-2.5-1.5L7 20V4Zm3 5h4m-4 4h4"/></svg><span>Receipts</span></button>
        <button data-tab="staff"><svg class="task-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5M8 12h8"/></svg><span>Booth</span></button>
        <button data-tab="setup"><svg class="task-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16v11H4zM3 9l2-5h14l2 5M9 20v-6h6v6"/></svg><span>Events</span></button>
      </nav>
      <div id="panel"></div>
      <p id="notice" role="status" aria-live="polite"></p>
    </section>
    <p class="app-foot">Bitcoin Cash mainnet · Wallets connect with WizardConnect (Cashonize) · <a href="https://github.com/thesithunyein/cupback">Source code</a> · <a href="./cupback-presentation.pdf">Presentation</a></p>
  </main>
  <script type="module" src="/src.js"></script>
</body>
</html>
